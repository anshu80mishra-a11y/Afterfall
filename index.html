<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050605;overflow:hidden;font-family:system-ui,sans-serif;color:#e8e2d0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
button{font:inherit;color:#e8e2d0;background:rgba(18,22,16,.8);border:1px solid rgba(232,226,208,.4);border-radius:12px;padding:8px 12px;touch-action:manipulation}
button.off{opacity:.4}
.z{position:fixed;z-index:3}
#rot{display:none;position:fixed;left:0;right:0;top:52px;z-index:19;text-align:center;font-size:13px;pointer-events:none;background:rgba(0,0,0,.55);padding:4px}
@media(orientation:portrait){#rot.on{display:block}#tb{right:auto!important;left:8px;top:96px!important;flex-wrap:wrap;width:150px}#trk{top:auto!important;bottom:250px;padding:0 90px 0 8px!important;text-align:left!important;font-size:12px!important}#hb{left:8px!important;transform:none!important;bottom:94px!important}#hint{bottom:160px!important}#stats{width:120px!important}#vit{left:auto!important;right:8px!important;top:106px!important;width:136px!important}#vtog{right:auto!important;left:-24px!important}}
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.78))}
#menu h1{font-family:Georgia,serif;letter-spacing:.14em;font-size:clamp(22px,5.5vw,50px);margin:0 0 6px;text-shadow:0 0 22px #a33;text-align:center}
#menu button{width:min(250px,60vw);font-size:17px;padding:11px}
#touch{position:fixed;inset:0;z-index:1;touch-action:none}
#stats{left:calc(env(safe-area-inset-left,0px) + 10px);top:8px;width:240px;pointer-events:none}
.b{height:10px;margin-bottom:4px;background:rgba(0,0,0,.55);border-radius:5px;overflow:hidden}.b i{display:block;height:100%}
#lv{font-size:11px;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mm{right:calc(env(safe-area-inset-right,0px) + 8px);top:8px;width:96px;height:96px;border-radius:50%;border:2px solid #e8e2d0aa}
#tb{right:calc(env(safe-area-inset-right,0px) + 112px);top:8px;display:flex;gap:6px}
#tb button{padding:6px 9px;font-size:14px}
#trk{top:8px;left:0;right:0;text-align:center;font-size:13px;pointer-events:none;text-shadow:0 1px 3px #000;padding:0 260px}
#msg{top:26%;left:0;right:0;text-align:center;font-size:17px;text-shadow:0 2px 4px #000;pointer-events:none;opacity:0;transition:opacity .3s}
#hint{bottom:78px;left:0;right:0;text-align:center;font-size:14px;pointer-events:none;text-shadow:0 1px 3px #000}
#hb{bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
#hb button{width:52px;height:52px;padding:0;font-size:22px;position:relative}
#hb button.sel{border-color:#f0c040;background:rgba(80,60,10,.8)}
sub{position:absolute;right:4px;bottom:2px;font-size:11px}
.ab{position:fixed;z-index:3;border-radius:50%;padding:0;font-size:14px}
#bA{width:84px;height:84px;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:14px;background:rgba(150,50,30,.85);font-size:17px}
#bJ{width:58px;height:58px;right:112px;bottom:16px}#bD{width:58px;height:58px;right:20px;bottom:108px}
#bI{width:58px;height:58px;right:100px;bottom:86px;background:rgba(40,90,50,.85)}#bW{width:52px;height:52px;right:24px;bottom:176px}
#knob{display:none;position:fixed;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);pointer-events:none;z-index:3}
#eb{top:34px;left:50%;transform:translateX(-50%);width:170px;text-align:center;font-size:12px;display:none;pointer-events:none}
#bm{bottom:74px;left:50%;transform:translateX(-50%);display:none;gap:8px}
#pan{display:none;position:fixed;z-index:15;inset:14px calc(env(safe-area-inset-right,0px) + 30px) 14px calc(env(safe-area-inset-left,0px) + 30px);background:rgba(10,12,8,.95);border:1px solid #e8e2d055;border-radius:14px;padding:12px;overflow:auto;touch-action:pan-y}
#pan h3{margin:0 0 8px}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:340px}
.sl{height:52px;font-size:22px;position:relative;padding:0}.sl.sel{border-color:#f0c040}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff18;font-size:14px}
#dn{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}.dn{position:fixed;font-weight:700;font-size:17px;text-shadow:0 1px 3px #000;pointer-events:none;transform:translate(-50%,0);animation:up .9s ease-out forwards}@keyframes up{to{transform:translate(-50%,-44px);opacity:0}}
#nm{position:fixed;inset:0;pointer-events:none;z-index:3}.nm{position:fixed;font-size:11px;font-weight:600;text-shadow:0 1px 2px #000;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap}
#vtog{position:absolute;right:-24px;top:2px;width:20px;height:20px;padding:0;pointer-events:auto;font-size:10px}#vit.mini .vr:not(#r_hp),#vit.mini #chips{display:none}
#vit{left:calc(env(safe-area-inset-left,0px) + 8px);top:30px;width:116px;background:rgba(0,0,0,.38);border-radius:9px;padding:3px 5px;pointer-events:none}
.vr{display:flex;align-items:center;gap:4px;font-size:10px;margin-bottom:2px}.vr .b{flex:1;margin:0;height:7px}.vr b{width:22px;text-align:right;font-size:9px}
#chips{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0}.chip{font-size:8px;padding:0 4px;border-radius:8px;background:rgba(255,255,255,.16)}
#qk{display:flex;gap:4px;margin-top:4px;pointer-events:auto;flex-wrap:wrap}#qk button{width:22px;height:24px;padding:0;font-size:12px;position:relative;border-radius:8px}#qk button sub{font-size:9px;right:2px;bottom:0}
.low{animation:pl .7s infinite}@keyframes pl{50%{opacity:.35}}
#fl{position:fixed;inset:0;background:#e00;opacity:0;pointer-events:none;z-index:2}
#dead{display:none;position:fixed;inset:0;z-index:30;background:rgba(30,0,0,.85);flex-direction:column;align-items:center;justify-content:center;gap:10px}
</style></head><body>

<canvas id="mm" class="z"></canvas>

<div id="trk" class="z"></div><div id="msg" class="z"></div><div id="hint" class="z"></div><div id="eb" class="z"><span id="ebn"></span><div class="b"><i id="ebf" style="background:#c33"></i></div></div>
<div id="hb" class="z"></div>
<button id="bA" class="ab">Attack</button><button id="bJ" class="ab">Jump</button><button id="bD" class="ab">Dodge</button><button id="bI" class="ab">Use</button><button id="bW" class="ab">Swap</button>
