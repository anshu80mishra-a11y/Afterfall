<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>NEON FRONTIER — Mobile Survival</title>
  <style>
    :root {
      --ui-bg: rgba(12, 17, 20, 0.78);
      --ui-border: rgba(255, 255, 255, 0.18);
      --red: #e63946;
      --orange: #f4a261;
      --blue: #2a9d8f;
      --gold: #e9c46a;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, system-ui, sans-serif; }
    canvas#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }

    /* Start / Rotate Screen */
    #start-screen {
      position: fixed; inset: 0; z-index: 99; background: radial-gradient(circle, #1a2634 0%, #080d12 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center;
      padding: 20px;
    }
    #start-screen h1 { font-size: 38px; letter-spacing: 2px; margin-bottom: 6px; }
    #start-screen p { font-size: 13px; color: #a0aec0; margin-bottom: 24px; }
    #btn-start {
      background: linear-gradient(135deg, #e67e22, #d35400); color: #fff; border: none;
      padding: 14px 34px; font-size: 16px; font-weight: bold; border-radius: 30px;
      box-shadow: 0 4px 18px rgba(230, 126, 34, 0.5); cursor: pointer; text-transform: uppercase;
    }

    /* UI Layout */
    .game-logo {
      position: absolute; top: 12px; left: 16px; z-index: 5; pointer-events: none;
    }
    .game-logo h1 { font-size: 20px; color: #f0f3f4; letter-spacing: 1px; font-weight: 800; }
    .game-logo p { font-size: 8px; color: #cbd5e0; letter-spacing: 2px; }

    /* Top Right Vitals */
    .status-hud {
      position: absolute; top: 10px; right: 16px; z-index: 5;
      background: var(--ui-bg); border: 1px solid var(--ui-border);
      border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; gap: 5px; min-width: 130px;
    }
    .stat-row { display: flex; align-items: center; gap: 8px; }
    .stat-icon { font-size: 11px; width: 14px; }
    .stat-bar { flex: 1; height: 7px; background: rgba(0,0,0,0.6); border-radius: 4px; overflow: hidden; }
    .stat-fill { height: 100%; border-radius: 4px; }
    .stat-hp { background: #e74c3c; }
    .stat-food { background: #e67e22; }
    .stat-water { background: #3498db; }

    /* Hotbar */
    .hotbar {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 5; background: var(--ui-bg);
      padding: 4px 8px; border-radius: 8px; border: 1px solid var(--ui-border);
    }
    .slot {
      width: 42px; height: 42px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative;
    }
    .slot.active { border-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
    .slot span { font-size: 18px; }
    .slot b { position: absolute; bottom: 2px; right: 3px; font-size: 8px; color: #fff; }

    /* Touch Controls */
    #touch-layer { position: fixed; inset: 0; z-index: 4; display: none; }
    #look-pad { position: absolute; right: 0; top: 0; width: 55%; height: 100%; touch-action: none; }
    
    #joy-base {
      position: absolute; bottom: 20px; left: 24px; width: 100px; height: 100px;
      border-radius: 50%; border: 2px solid rgba(255,255,255,0.25);
      background: radial-gradient(circle, rgba(255,255,255,0.08), rgba(0,0,0,0.4));
      touch-action: none;
    }
    #joy-stick {
      position: absolute; left: 50%; top: 50%; width: 40px; height: 40px;
      border-radius: 50%; background: rgba(255,255,255,0.45); border: 1px solid #fff;
      transform: translate(-50%, -50%); pointer-events: none;
    }

    .action-pad {
      position: absolute; bottom: 16px; right: 18px; display: flex; flex-direction: column; gap: 8px;
    }
    .action-btn {
      width: 46px; height: 46px; border-radius: 50%; background: var(--ui-bg);
      border: 1.5px solid var(--ui-border); color: #fff; font-size: 18px;
      display: flex; align-items: center; justify-content: center; touch-action: manipulation;
    }
    .action-btn:active { background: rgba(230,126,34,0.6); transform: scale(0.94); }

    .crosshair {
      position: absolute; left: 50%; top: 50%; width: 5px; height: 5px;
      background: #fff; border-radius: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 3; box-shadow: 0 0 4px #000;
    }
    #toast {
      position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #fff; padding: 6px 14px; border-radius: 5px;
      border-left: 3px solid var(--gold); font-size: 11px; z-index: 10; opacity: 0; transition: opacity .2s;
    }
    #toast.show { opacity: 1; }
      /* Frontier tech HUD, compact on phones and safe-area aware. */
    .tech-resources { position: fixed; z-index: 6; top: 112px; right: 16px; display: flex; gap: 5px; }
    .tech-chip { padding: 5px 7px; border: 1px solid rgba(105,245,232,.25); border-radius: 8px; background: rgba(7,19,26,.82); color: #eaffff; font-size: 9px; font-weight: 800; }
    .tech-chip small { margin-left: 3px; color: #80b4b6; font-size: 7px; }
    #btn-build { position: fixed; z-index: 8; top: 151px; right: 16px; padding: 8px 11px; color: #09201f; background: linear-gradient(110deg,#82ffe1,#69cfff); border: 1px solid rgba(205,255,249,.8); border-radius: 9px; font-size: 9px; font-weight: 900; letter-spacing: .1em; box-shadow: 0 0 16px rgba(75,255,229,.18); touch-action: manipulation; }
    #build-panel { position: fixed; z-index: 20; right: 12px; top: 195px; width: min(340px, calc(100vw - 24px)); padding: 12px; border: 1px solid rgba(105,245,232,.35); border-radius: 13px; color: white; background: rgba(6,18,25,.95); box-shadow: 0 12px 38px rgba(0,0,0,.45); display: none; }
    #build-panel.show { display: block; }
    #build-panel h2 { margin: 0 0 4px; color: #9ffff1; font-size: 12px; letter-spacing: .12em; }
    #build-panel p { margin: 0 0 9px; color: #9ababb; font-size: 9px; }
    .fab-option { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; padding: 9px; border: 1px solid rgba(105,245,232,.2); border-radius: 9px; color: #efffff; background: rgba(80,200,190,.08); text-align: left; font-size: 10px; font-weight: 800; touch-action: manipulation; }
    .fab-option small { color: #9ababb; font-size: 8px; font-weight: 600; }
    .fab-close { float: right; border: 0; background: transparent; color: #cafff9; font-size: 18px; }
    @media (max-width: 600px) {
      .tech-resources { top: 105px; right: 9px; gap: 3px; }
      .tech-chip { padding: 4px 5px; font-size: 8px; }
      #btn-build { top: 139px; right: 9px; padding: 7px 9px; }
      #build-panel { top: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); right: 8px; width: min(310px, calc(100vw - 16px)); }
      .hotbar { bottom: calc(9px + env(safe-area-inset-bottom, 0px)); }
      #joy-base { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- Start Screen to activate Landscape & Fullscreen -->
  <div id="start-screen">
    <h1>NEON FRONTIER</h1>
    <p>BUILD · GROW · SURVIVE</p>
    <button id="btn-start">START GAME</button>
  </div>

  <canvas id="world"></canvas>
  <div class="crosshair"></div>

  <div class="game-logo">
    <h1>NEON FRONTIER</h1>
    <p>OUTPOST 07 · SURVIVE</p>
  </div>

  <div class="status-hud">
    <div class="stat-row"><span class="stat-icon">❤️</span><div class="stat-bar"><div class="stat-fill stat-hp" id="bar-hp" style="width:100%"></div></div></div>
    <div class="stat-row"><span class="stat-icon">🍖</span><div class="stat-bar"><div class="stat-fill stat-food" id="bar-food" style="width:85%"></div></div></div>
    <div class="stat-row"><span class="stat-icon">💧</span><div class="stat-bar"><div class="stat-fill stat-water" id="bar-water" style="width:80%"></div></div></div>
  </div>

  <div class="tech-resources" aria-label="Outpost materials">
    <div class="tech-chip">🪵 <span id="tech-wood">10</span><span id="txt-wood" hidden>10</span><small>WOOD</small></div>
    <div class="tech-chip">⬡ <span id="tech-scrap">8</span><small>TECH</small></div>
    <div class="tech-chip">🌱 <span id="tech-seeds">4</span><small>SEEDS</small></div>
  </div>
  <button id="btn-build" aria-expanded="false">＋ FABRICATOR</button>
  <section id="build-panel" aria-hidden="true">
    <button class="fab-close" id="fab-close" aria-label="Close">×</button>
    <h2>OUTPOST FABRICATOR</h2><p>Build a smarter frontier. Modules deploy just ahead of you.</p>
    <button class="fab-option" data-build="relay"><span>📡 SOLAR RELAY<br><small>Extend the clean power grid</small></span><b>2 🪵 · 4 ⬡</b></button>
    <button class="fab-option" data-build="purifier"><span>💧 WATER RECYCLER<br><small>Restore hydration at the unit</small></span><b>3 🪵 · 5 ⬡</b></button>
    <button class="fab-option" data-build="farm"><span>🪴 HYDROPONIC BAY<br><small>Eight new smart grow beds</small></span><b>6 🪵 · 4 ⬡</b></button>
  </section>
  <div class="hotbar">
    <div class="slot active" data-tool="axe"><span>🪓</span></div>
    <div class="slot" data-tool="torch"><span>🔥</span></div>
    <div class="slot" data-tool="seeds"><span>🌱</span><b id="txt-seeds">4</b></div>
    <div class="slot" data-tool="food"><span>🥩</span><b id="txt-food">3</b></div>
  </div>

  <div id="touch-layer">
    <div id="look-pad"></div>
    <div id="joy-base"><div id="joy-stick"></div></div>
    <div class="action-pad">
      <button class="action-btn" id="btn-act">⚔️</button>
      <button class="action-btn" id="btn-use">🖐️</button>
      <button class="action-btn" id="btn-jump">⬆️</button>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import * as THREE from "three";

    const canvas = document.getElementById("world");
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xd19363, 0.0035);

    const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 800);
    camera.rotation.order = "YXZ";
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    // Golden Sunset Sky
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: {
        topColor: { value: new THREE.Color(0x2d4356) },
        horizonColor: { value: new THREE.Color(0xed8547) }
      },
      vertexShader: "varying float vY; void main(){ vY = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
      fragmentShader: "uniform vec3 topColor; uniform vec3 horizonColor; varying float vY; void main(){ float h = smoothstep(-0.1, 0.5, vY); gl_FragColor = vec4(mix(horizonColor, topColor, h), 1.0); }"
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(600, 16, 16), skyMat));

    const hemiLight = new THREE.HemisphereLight(0xffdfba, 0x223026, 0.9);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffa552, 2.0);
    sunLight.position.set(20, 30, -100);
    scene.add(sunLight);

    const torchLight = new THREE.PointLight(0xff8822, 0, 15, 1.6);
    camera.add(torchLight);
    scene.add(camera);

    // Terrain
    function getTerrainY(x, z) {
      return Math.sin(x * 0.05) * 1.5 + Math.cos(z * 0.04) * 1.2;
    }

    const groundGeo = new THREE.PlaneGeometry(300, 300, 60, 60);
    const pos = groundGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = -pos.getY(i);
      pos.setZ(i, getTerrainY(x, z));
    }
    groundGeo.computeVertexNormals();
    const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x424e35, roughness: 0.95 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Mountains
    const mtnMat = new THREE.MeshStandardMaterial({ color: 0x525c66 });
    for (let i = 0; i < 7; i++) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(35, 60, 5), mtnMat);
      const a = (i / 7) * Math.PI + 0.3;
      cone.position.set(Math.cos(a) * 170, 20, -120 + Math.sin(a) * 30);
      scene.add(cone);
    }

    // River
    const river = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 260),
      new THREE.MeshStandardMaterial({ color: 0x1d4d68, roughness: 0.1, metalness: 0.4, transparent: true, opacity: 0.85 })
    );
    river.rotation.x = -Math.PI / 2;
    river.position.set(-35, -0.6, -20);
    scene.add(river);

    // Trees
    const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 3.5, 5);
    const leavesGeo = new THREE.ConeGeometry(1.9, 4, 5);
    const trunkM = new THREE.MeshStandardMaterial({ color: 0x3d2b1f });
    const leavesM = new THREE.MeshStandardMaterial({ color: 0x213a29 });

    const trees = [];
    for (let i = 0; i < 45; i++) {
      const tx = (Math.random() - 0.5) * 160;
      const tz = (Math.random() - 0.5) * 160;
      if (Math.hypot(tx, tz) < 14) continue;
      const g = new THREE.Group();
      const tr = new THREE.Mesh(trunkGeo, trunkM); tr.position.y = 1.75;
      const lv = new THREE.Mesh(leavesGeo, leavesM); lv.position.y = 4.2;
      g.add(tr, lv);
      g.position.set(tx, getTerrainY(tx, tz), tz);
      scene.add(g);
      trees.push({ group: g, x: tx, z: tz, hp: 3 });
    }

    // Cabin & Campfire
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(7, 3.5, 6), new THREE.MeshStandardMaterial({ color: 0x4a3625 }));
    cabin.position.set(14, getTerrainY(14, -10) + 1.75, -10);
    scene.add(cabin);

    const campLight = new THREE.PointLight(0xff6611, 2.5, 12, 1.8);
    campLight.position.set(0, 1.2, -6);
    scene.add(campLight);

    // Player State
    const player = { x: 0, z: 0, y: 1.7, yaw: 0, pitch: 0, hp: 100, food: 85, water: 80, wood: 10, meat: 3 };
    let activeTool = "axe";
    let joyMove = { x: 0, y: 0 };

    function toast(text) {
      const t = document.getElementById("toast");
      t.textContent = text; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }

    // Start Button -> Landscape & Fullscreen
    document.getElementById("btn-start").addEventListener("click", async () => {
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("touch-layer").style.display = "block";

      try {
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          await document.documentElement.webkitRequestFullscreen();
        }
      } catch (err) {}

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock("landscape");
        }
      } catch (err) {}

      resize();
    });

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener("resize", resize);

    // Joystick Touch Handler
    const joyBase = document.getElementById("joy-base");
    const joyStick = document.getElementById("joy-stick");
    let joyTouchId = null;

    joyBase.addEventListener("touchstart", e => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      handleJoy(touch);
    }, { passive: false });

    joyBase.addEventListener("touchmove", e => {
      e.preventDefault();
      for (let t of e.changedTouches) {
        if (t.identifier === joyTouchId) handleJoy(t);
      }
    }, { passive: false });

    const endJoy = e => {
      for (let t of e.changedTouches) {
        if (t.identifier === joyTouchId) {
          joyTouchId = null;
          joyMove = { x: 0, y: 0 };
          joyStick.style.left = "50%"; joyStick.style.top = "50%";
        }
      }
    };
    joyBase.addEventListener("touchend", endJoy);
    joyBase.addEventListener("touchcancel", endJoy);

    function handleJoy(touch) {
      const rect = joyBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = touch.clientX - cx;
      let dy = touch.clientY - cy;
      const dist = Math.hypot(dx, dy);
      const maxR = rect.width / 2;

      if (dist > maxR) {
        dx = (dx / dist) * maxR;
        dy = (dy / dist) * maxR;
      }
      joyStick.style.left = `${50 + (dx / maxR) * 35}%`;
      joyStick.style.top = `${50 + (dy / maxR) * 35}%`;
      joyMove.x = dx / maxR;
      joyMove.y = dy / maxR;
    }

    // Look/Camera Touch Handler
    const lookPad = document.getElementById("look-pad");
    let lookTouchId = null, lastTouchX = 0, lastTouchY = 0;

    lookPad.addEventListener("touchstart", e => {
      const t = e.changedTouches[0];
      lookTouchId = t.identifier;
      lastTouchX = t.clientX;
      lastTouchY = t.clientY;
    });

    lookPad.addEventListener("touchmove", e => {
      for (let t of e.changedTouches) {
        if (t.identifier === lookTouchId) {
          const dx = t.clientX - lastTouchX;
          const dy = t.clientY - lastTouchY;
          player.yaw -= dx * 0.005;
          player.pitch = Math.max(-1.2, Math.min(1.2, player.pitch - dy * 0.004));
          lastTouchX = t.clientX;
          lastTouchY = t.clientY;
        }
      }
    });

    const endLook = e => {
      for (let t of e.changedTouches) {
        if (t.identifier === lookTouchId) lookTouchId = null;
      }
    };
    lookPad.addEventListener("touchend", endLook);
    lookPad.addEventListener("touchcancel", endLook);

    // Hotbar selection
    document.querySelectorAll(".slot").forEach(s => {
      s.addEventListener("click", () => {
        document.querySelectorAll(".slot").forEach(sl => sl.classList.remove("active"));
        s.classList.add("active");
        activeTool = s.dataset.tool;
        torchLight.intensity = activeTool === "torch" ? 2.2 : 0;
        toast("Equipped: " + activeTool.toUpperCase());
      });
    });

    // Action Buttons
    document.getElementById("btn-act").addEventListener("click", () => {
      if (activeTool === "axe") {
        let hit = false;
        trees.forEach(tr => {
          if (Math.hypot(tr.x - player.x, tr.z - player.z) < 3.8 && tr.hp > 0) {
            tr.hp--; hit = true;
            player.wood += 2;
            document.getElementById("txt-wood").textContent = player.wood;
            toast("+2 Wood 🪵");
            if (tr.hp <= 0) scene.remove(tr.group);
          }
        });
        if (!hit) toast("Chopping air 🪓");
      } else if (activeTool === "food") {
        if (player.meat > 0) {
          player.meat--;
          player.food = Math.min(100, player.food + 25);
          document.getElementById("txt-food").textContent = player.meat;
          toast("Ate cooked meat 🥩");
        } else toast("No food left!");
      }
    });

    document.getElementById("btn-use").addEventListener("click", () => {
      if (Math.hypot(player.x - (-35), player.z - (-20)) < 24) {
        player.water = Math.min(100, player.water + 30);
        toast("Drank fresh river water 💧");
      } else {
        toast("Campfire safe zone 🔥");
      }
    });

    // Neon habitat, hydroponic greenhouse and smart salvage around the original outpost.
    scene.fog.color.set(0x173c42);
    sunLight.color.set(0x83e9d8);
    hemiLight.color.set(0xb6f2e8);
    cabin.visible = false;
    const techMetal = new THREE.MeshStandardMaterial({ color: 0x203943, metalness: 0.68, roughness: 0.36 });
    const techTrim = new THREE.MeshStandardMaterial({ color: 0x56f5df, emissive: 0x1ecab8, emissiveIntensity: 1.25, metalness: 0.25, roughness: 0.25 });
    const techGlass = new THREE.MeshStandardMaterial({ color: 0x53cbd4, emissive: 0x0f5967, emissiveIntensity: 0.32, transparent: true, opacity: 0.34, metalness: 0.25, roughness: 0.12 });
    const techSolar = new THREE.MeshStandardMaterial({ color: 0x174f7a, emissive: 0x0b5277, emissiveIntensity: 0.42, metalness: 0.65, roughness: 0.23 });
    function techBox(parent, w, h, d, material, x, y, z) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      m.position.set(x, y, z); parent.add(m); return m;
    }
    function techPanel(parent, x, y, z, w, d) {
      const p = new THREE.Group(); p.position.set(x, y, z); parent.add(p);
      const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.12, 1, 5), techMetal);
      stand.position.y = -0.48; p.add(stand);
      const plate = techBox(p, w, 0.1, d, techSolar, 0, 0.08, 0);
      plate.rotation.x = -0.12;
      for (let i = 1; i < 4; i++) {
        const line = techBox(p, 0.035, 0.035, d - 0.12, techTrim, -w / 2 + w * i / 4, 0.15, 0);
        line.rotation.x = -0.12;
      }
      return p;
    }

    const baseGlow = new THREE.PointLight(0x32e3d4, 0.8, 42);
    baseGlow.position.set(6, 8, -13); scene.add(baseGlow);
    const habitat = new THREE.Group();
    habitat.position.set(14, getTerrainY(14, -10), -10);
    scene.add(habitat);
    techBox(habitat, 10, 0.45, 8, techMetal, 0, 0.24, 0);
    techBox(habitat, 7.3, 3.9, 5.8, new THREE.MeshStandardMaterial({ color: 0x263c47, metalness: 0.42, roughness: 0.48 }), 0, 2.35, 0);
    techBox(habitat, 8.1, 0.32, 6.6, techMetal, 0, 4.45, 0);
    techBox(habitat, 7.6, 0.06, 6.2, techTrim, 0, 4.64, 0);
    for (const x of [-3.75, 3.75]) {
      techBox(habitat, 0.1, 4.1, 6.1, techTrim, x, 2.35, 0);
      techBox(habitat, 0.65, 1.0, 0.08, techGlass, x * 0.55, 2.65, 2.94);
    }
    techBox(habitat, 1.35, 2.25, 0.12, techMetal, 0, 1.45, 2.96);
    techBox(habitat, 1.5, 0.07, 0.09, techTrim, 0, 2.62, 3.05);
    techPanel(habitat, -2.1, 5.1, -0.6, 2.0, 1.5);
    techPanel(habitat, 0, 5.1, -0.6, 2.0, 1.5);
    techPanel(habitat, 2.1, 5.1, -0.6, 2.0, 1.5);
    const aerial = new THREE.Group(); aerial.position.set(3.3, 4.8, -2.4); habitat.add(aerial);
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.1, 2.4, 6), techMetal);
    mast.position.y = 1.15; aerial.add(mast);
    const mastLamp = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 6), techTrim);
    mastLamp.position.y = 2.35; aerial.add(mastLamp);
    const habitatGlow = new THREE.PointLight(0x50efd8, 1.1, 24);
    habitatGlow.position.set(0, 2.5, 1); habitat.add(habitatGlow);

    const techBeds = [];
    const farms = [];
    let techSeeds = 4, techScrap = 8, builtTech = 0, techClock = 0, jumpTime = 0;
    function makeTechFarm(cx, cz, seeded) {
      const g = new THREE.Group(); g.position.set(cx, getTerrainY(cx, cz), cz); scene.add(g);
      techBox(g, 12, 0.35, 10, techMetal, 0, 0.18, 0);
      for (const x of [-5.7, 5.7]) for (const z of [-4.6, 4.6]) {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 3.55, 5), techMetal);
        post.position.set(x, 2.0, z); g.add(post);
      }
      techBox(g, 11.5, 0.09, 9.2, techGlass, 0, 3.35, 0);
      techBox(g, 0.08, 3.2, 9.1, techTrim, -5.7, 2.0, 0);
      techBox(g, 0.08, 3.2, 9.1, techTrim, 5.7, 2.0, 0);
      techBox(g, 11.5, 0.08, 0.08, techTrim, 0, 3.55, -4.6);
      techBox(g, 11.5, 0.08, 0.08, techTrim, 0, 3.55, 4.6);
      const localBeds = [];
      for (let row = 0; row < 2; row++) for (let col = 0; col < 4; col++) {
        const bed = new THREE.Group(); bed.position.set(-4.35 + col * 2.9, 0.48, row ? 2.0 : -2.0); g.add(bed);
        techBox(bed, 2.35, 0.36, 1.45, techMetal, 0, 0, 0);
        techBox(bed, 2.15, 0.08, 1.25, new THREE.MeshStandardMaterial({ color: 0x44392b }), 0, 0.22, 0);
        techBox(bed, 2.2, 0.045, 0.05, techTrim, 0, 0.25, -0.62);
        const crop = new THREE.Group(); crop.position.y = 0.28; bed.add(crop);
        for (let n = 0; n < 3; n++) {
          const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.055, 0.8, 5), new THREE.MeshStandardMaterial({ color: 0x6fe181 }));
          stalk.position.set((n - 1) * 0.52, 0.4, 0); crop.add(stalk);
          const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.22, 6, 5), new THREE.MeshStandardMaterial({ color: 0x75e08a }));
          leaf.scale.set(1.35, 0.6, 0.8); leaf.position.set((n - 1) * 0.52, 0.58, 0.04); crop.add(leaf);
          if (n === 1) {
            const fruit = new THREE.Mesh(new THREE.SphereGeometry(0.14, 7, 6), new THREE.MeshStandardMaterial({ color: 0xffbd55, emissive: 0x704500, emissiveIntensity: 0.4 }));
            fruit.position.set(0, 0.84, 0.08); crop.add(fruit);
          }
        }
        const index = row * 4 + col;
        const status = seeded && index < 3 ? "ready" : seeded && index < 5 ? "growing" : "empty";
        crop.scale.setScalar(status === "ready" ? 1 : status === "growing" ? 0.3 : 0);
        const item = { mesh: bed, crop: crop, status: status, plantedAt: status === "ready" ? -40 : techClock };
        localBeds.push(item); techBeds.push(item);
      }
      farms.push({ group: g, x: cx, z: cz, beds: localBeds });
    }
    makeTechFarm(-10, -15, true);

    const techSalvage = [];
    const builtPurifiers = [];
    function makeSalvage(x, z) {
      const g = new THREE.Group(); g.position.set(x, getTerrainY(x, z), z); scene.add(g);
      techBox(g, 1.6, 1.1, 1.3, techMetal, 0, 0.55, 0);
      techBox(g, 1.72, 0.1, 1.4, techTrim, 0, 1.12, 0);
      techBox(g, 0.08, 0.65, 0.08, techTrim, 0, 0.65, 0.7);
      const lamp = new THREE.PointLight(0x55f4e1, 0.55, 6); lamp.position.y = 1.4; g.add(lamp);
      techSalvage.push({ group: g, x: x, z: z, live: true });
    }
    makeSalvage(-20, -6); makeSalvage(25, -20); makeSalvage(-25, 22); makeSalvage(36, 18);

    function syncTechHud() {
      document.getElementById("tech-wood").textContent = player.wood;
      document.getElementById("tech-scrap").textContent = techScrap;
      document.getElementById("tech-seeds").textContent = techSeeds;
      document.getElementById("txt-seeds").textContent = techSeeds;
      document.getElementById("txt-wood").textContent = player.wood;
    }
    function closestBed() {
      let best = null, dist = Infinity;
      for (const b of techBeds) {
        const x = b.mesh.getWorldPosition(new THREE.Vector3()).x;
        const z = b.mesh.getWorldPosition(new THREE.Vector3()).z;
        const d = Math.hypot(x - player.x, z - player.z);
        if (d < dist) { best = b; dist = d; }
      }
      return { bed: best, distance: dist };
    }
    function plantOrHarvest() {
      const target = closestBed();
      if (!target.bed || target.distance > 6.5) return false;
      const bed = target.bed;
      if (bed.status === "ready") {
        bed.status = "empty"; bed.crop.scale.setScalar(0);
        player.meat++; techSeeds++; syncTechHud();
        document.getElementById("txt-food").textContent = player.meat;
        toast("+1 fresh ration · +1 seed");
        return true;
      }
      if (bed.status === "growing") { toast("Hydroponic crop is growing. Check back soon."); return true; }
      if (techSeeds <= 0) { toast("No seeds. Harvest a ripe bed to collect more."); return true; }
      techSeeds--; bed.status = "growing"; bed.plantedAt = techClock; bed.crop.scale.setScalar(0.22);
      syncTechHud(); toast("Seed planted · smart bed is online");
      return true;
    }
    function techInteract() {
      if (plantOrHarvest()) return true;
      let closest = null, dist = Infinity;
      for (const node of techSalvage) if (node.live) {
        const d = Math.hypot(node.x - player.x, node.z - player.z);
        if (d < dist) { closest = node; dist = d; }
      }
      if (closest && dist < 4.5) {
        closest.live = false; scene.remove(closest.group); techScrap += 3;
        syncTechHud(); toast("Tech salvage recovered · +3 components"); return true;
      }
      return false;
    }
    function buildTech(type) {
      const costs = { relay: [2,4], purifier: [3,5], farm: [6,4] };
      const cost = costs[type]; if (!cost) return;
      if (player.wood < cost[0] || techScrap < cost[1]) { toast("Need more wood or tech salvage to build this module."); return; }
      player.wood -= cost[0]; techScrap -= cost[1]; builtTech++; syncTechHud();
      const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
      const x = player.x + fx * 9 + Math.cos(player.yaw) * ((builtTech % 3 - 1) * 6);
      const z = player.z + fz * 9 - Math.sin(player.yaw) * ((builtTech % 3 - 1) * 6);
      if (type === "farm") { makeTechFarm(x, z, false); toast("Hydroponic bay deployed · 8 smart beds online"); }
      else {
        const g = new THREE.Group(); g.position.set(x, getTerrainY(x, z), z); scene.add(g);
        techBox(g, 3, 0.35, 3, techMetal, 0, 0.18, 0);
        if (type === "relay") {
          const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.18, 4.8, 6), techMetal); pole.position.y = 2.7; g.add(pole);
          const ring = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.08, 6, 12), techTrim); ring.position.y = 4; ring.rotation.x = Math.PI / 2; g.add(ring);
          techPanel(g, -1.3, 1.4, 1.1, 1.7, 1.3); techPanel(g, 1.3, 1.4, 1.1, 1.7, 1.3);
          const light = new THREE.PointLight(0x55f5df, 0.85, 17); light.position.y = 4.2; g.add(light);
          toast("Solar relay built · power grid expanded");
        } else {
          const tank = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.76, 2.3, 8), techMetal); tank.position.y = 1.45; g.add(tank);
          const band = new THREE.Mesh(new THREE.TorusGeometry(0.66, 0.07, 5, 12), techTrim); band.position.y = 1.7; band.rotation.x = Math.PI / 2; g.add(band);
          const light = new THREE.PointLight(0x46dafa, 0.7, 11); light.position.y = 2.3; g.add(light);
          g.userData.isRecycler = true; builtPurifiers.push({ x: x, z: z }); toast("Water recycler built · interact beside it");
        }
      }
      document.getElementById("build-panel").classList.remove("show");
      document.getElementById("build-panel").setAttribute("aria-hidden", "true");
      document.getElementById("btn-build").setAttribute("aria-expanded", "false");
      updateObjective();
    }
    document.getElementById("btn-jump").addEventListener("click", function () { jumpTime = 0.55; });
    document.getElementById("btn-build").addEventListener("click", function () {
      const panel = document.getElementById("build-panel");
      const open = !panel.classList.contains("show");
      panel.classList.toggle("show", open);
      panel.setAttribute("aria-hidden", open ? "false" : "true");
      this.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.getElementById("fab-close").addEventListener("click", function () {
      document.getElementById("build-panel").classList.remove("show");
      document.getElementById("build-panel").setAttribute("aria-hidden", "true");
      document.getElementById("btn-build").setAttribute("aria-expanded", "false");
    });
    document.querySelectorAll(".fab-option").forEach(function (button) {
      button.addEventListener("click", function () { buildTech(button.dataset.build); });
    });
    document.getElementById("btn-use").addEventListener("click", function (event) {
      if (techInteract()) { event.stopImmediatePropagation(); event.preventDefault(); }
    }, true);
    document.getElementById("btn-act").addEventListener("click", function (event) {
      if (activeTool === "seeds" && plantOrHarvest()) { event.stopImmediatePropagation(); event.preventDefault(); }
    }, true);
    const techKeys = Object.create(null);
    window.addEventListener("keydown", function (event) {
      techKeys[event.code] = true;
      if (event.code === "KeyE") document.getElementById("btn-use").click();
      if (event.code === "KeyF") document.getElementById("btn-act").click();
      if (event.code === "KeyB") document.getElementById("btn-build").click();
      if (event.code === "Space") jumpTime = 0.55;
    });
    window.addEventListener("keyup", function (event) { techKeys[event.code] = false; });
    canvas.addEventListener("click", function () {
      if (!matchMedia("(pointer: coarse)").matches && document.pointerLockElement !== canvas && canvas.requestPointerLock) canvas.requestPointerLock();
    });
    document.addEventListener("mousemove", function (event) {
      if (document.pointerLockElement === canvas) {
        player.yaw -= event.movementX * 0.0028;
        player.pitch = Math.max(-1.15, Math.min(1.15, player.pitch - event.movementY * 0.0022));
      }
    });
    function updateTechWorld(dt) {
      techClock += dt;
      for (const bed of techBeds) if (bed.status === "growing") {
        const growth = Math.min(1, (techClock - bed.plantedAt) / 34);
        bed.crop.scale.setScalar(0.22 + growth * 0.78);
        if (growth >= 1) bed.status = "ready";
      }
      if (Math.random() < 0.035) mastLamp.material.emissiveIntensity = 0.7 + Math.random() * 0.9;
      if ((techKeys.KeyW || techKeys.ArrowUp) && !document.getElementById("build-panel").classList.contains("show")) {
        player.x -= Math.sin(player.yaw) * 4.2 * dt; player.z -= Math.cos(player.yaw) * 4.2 * dt;
      }
      if ((techKeys.KeyS || techKeys.ArrowDown) && !document.getElementById("build-panel").classList.contains("show")) {
        player.x += Math.sin(player.yaw) * 4.2 * dt; player.z += Math.cos(player.yaw) * 4.2 * dt;
      }
      if ((techKeys.KeyA || techKeys.ArrowLeft) && !document.getElementById("build-panel").classList.contains("show")) {
        player.x -= Math.cos(player.yaw) * 4.2 * dt; player.z += Math.sin(player.yaw) * 4.2 * dt;
      }
      if ((techKeys.KeyD || techKeys.ArrowRight) && !document.getElementById("build-panel").classList.contains("show")) {
        player.x += Math.cos(player.yaw) * 4.2 * dt; player.z -= Math.sin(player.yaw) * 4.2 * dt;
      }
    }
    // Game Loop
    let lastTime = performance.now();
    function tick() {
      requestAnimationFrame(tick);
      const now = performance.now();
      const dt = Math.min((now - lastTime) * 0.001, 0.05);
      lastTime = now;

      updateTechWorld(dt);
      // Joystick Movement
      if (Math.abs(joyMove.x) > 0.05 || Math.abs(joyMove.y) > 0.05) {
        const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
        const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
        const moveVec = fwd.multiplyScalar(-joyMove.y).add(right.multiplyScalar(joyMove.x));
        const speed = 4.8;
        player.x += moveVec.x * speed * dt;
        player.z += moveVec.z * speed * dt;
      }

      player.y = getTerrainY(player.x, player.z) + 1.65;
      camera.position.set(player.x, player.y, player.z);
      if (jumpTime > 0) camera.position.y += Math.sin((0.55 - jumpTime) / 0.55 * Math.PI) * 1.35;
      camera.rotation.set(player.pitch, player.yaw, 0, "YXZ");

      // Vitals Decay
      player.food = Math.max(0, player.food - 0.02 * dt);
      player.water = Math.max(0, player.water - 0.04 * dt);
      document.getElementById("bar-hp").style.width = player.hp + "%";
      document.getElementById("bar-food").style.width = player.food + "%";
      document.getElementById("bar-water").style.width = player.water + "%";

      renderer.render(scene, camera);
    }
    tick();
  </script>
</body>
</html>
